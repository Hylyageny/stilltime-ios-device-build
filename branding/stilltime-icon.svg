<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#16242C"/>
      <stop offset="100%" stop-color="#091116"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <g transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="20"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#C2F74D" stroke-width="20"
            stroke-linecap="round" stroke-dasharray="679 943" filter="url(#glow)"/>
  </g>
</svg>
